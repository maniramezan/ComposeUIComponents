site_name: Compose UI Design System
site_description: Reusable Kotlin-first Jetpack Compose design system for Android apps.
repo_url: https://github.com/maniramezan/ComposeUIComponents
repo_name: maniramezan/ComposeUIComponents

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Theming: theming.md
  - Components:
      - Primary Button: components/primary-button.md
      - Actions: components/actions.md
      - Inputs: components/inputs.md
      - Containers: components/containers.md
      - Lists: components/lists.md
      - Navigation: components/navigation.md
      - Media: components/media.md
      - Feedback: components/feedback.md
      - Typography: components/typography.md
  - Quality:
      - Accessibility: accessibility.md
      - Performance: performance.md
  - Migration: migration.md
  - Extraction Candidates: extraction-candidates.md
  - Contributing: contributing.md
  - Release: release.md
  - ADRs:
      - Index: adr/index.md
      - Theming Model: adr/0001-theming-model.md
      - Module Boundaries: adr/0002-module-boundaries.md
      - Testing Strategy: adr/0003-testing-strategy.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
