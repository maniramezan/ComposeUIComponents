site_name: Compose UI Design System
site_description: Reusable Kotlin-first Jetpack Compose design system for Android apps.
repo_url: https://github.com/maniramezan/ComposeUISystemDesign
repo_name: maniramezan/ComposeUISystemDesign

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Theming: theming.md
  - Components:
      - Primary Button: components/primary-button.md
      - Actions: components/actions.md
      - Inputs: components/inputs.md
      - Containers: components/containers.md
      - Lists: components/lists.md
      - Navigation: components/navigation.md
      - Feedback: components/feedback.md
      - Typography: components/typography.md
  - Quality:
      - Accessibility: accessibility.md
      - Performance: performance.md
  - Migration: migration.md
  - Extraction Candidates: extraction-candidates.md
  - Changelog: changelog.md
  - Contributing: contributing.md
  - Release: release.md
  - ADRs:
      - Theming Model: adr/0001-theming-model.md
      - Module Boundaries: adr/0002-module-boundaries.md
      - Testing Strategy: adr/0003-testing-strategy.md
      - Catalog Choice: adr/0004-catalog-choice.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
