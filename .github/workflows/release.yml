name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Check
        run: ./gradlew check
      - name: Record component screenshots
        run: ./gradlew :components:recordRoborazziDebug
      - name: Assemble release assets
        run: ./gradlew :catalog:assembleDebug :sample:assembleDebug

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

      - name: Package component screenshots
        run: tar -czf component-screenshots.tar.gz -C components/build outputs/roborazzi reports/roborazzi

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            catalog/build/outputs/apk/debug/catalog-debug.apk
            sample/build/outputs/apk/debug/sample-debug.apk
            component-screenshots.tar.gz
