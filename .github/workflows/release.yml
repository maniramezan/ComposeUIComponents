name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      # Fail fast if the pushed tag (e.g. v0.3.0) doesn't match VERSION_NAME in
      # gradle.properties. Without this, a tag whose version is already on Maven
      # Central re-publishes an existing version and fails late during upload.
      - name: Verify tag matches VERSION_NAME
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          echo "Tag version: $TAG | VERSION_NAME: $VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION_NAME=$VER. Bump VERSION_NAME and re-tag."
            exit 1
          fi

      - name: Check
        run: ./gradlew check
      - name: Record component screenshots
        run: ./gradlew :components:recordRoborazziDebug
      - name: Assemble release assets
        run: ./gradlew :catalog:assembleDebug :sample:assembleDebug

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

      - name: Package component screenshots
        run: tar -czf component-screenshots.tar.gz -C components/build outputs/roborazzi reports/roborazzi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            catalog/build/outputs/apk/debug/catalog-debug.apk
            sample/build/outputs/apk/debug/sample-debug.apk
            component-screenshots.tar.gz
