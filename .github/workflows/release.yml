name: Release

# Reusable publish workflow. Invoked automatically by Release Please once it
# creates a release (see release-please.yml), and available as a manual
# fallback via workflow_dispatch. It is intentionally NOT triggered by tag
# pushes: release-please creates tags with GITHUB_TOKEN, and GitHub does not
# fire tag-push workflows from GITHUB_TOKEN events, so that path never worked.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build and publish (e.g. v0.5.1)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish (e.g. v0.5.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      # Fail fast if the resolved tag doesn't match VERSION_NAME in
      # gradle.properties. Without this, publishing a version that's already on
      # Maven Central fails late during upload. The sed/tr strips any trailing
      # release-please marker comment and whitespace from the value.
      - name: Verify tag matches VERSION_NAME
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          TAG="${TAG_INPUT#v}"
          VER="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2 | sed 's/#.*//' | tr -d '[:space:]')"
          echo "Tag version: $TAG | VERSION_NAME: $VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag $TAG_INPUT does not match VERSION_NAME=$VER. Bump VERSION_NAME and re-tag."
            exit 1
          fi

      - name: Check
        run: ./gradlew check
      - name: Record component screenshots
        run: ./gradlew :components:recordRoborazziDebug
      - name: Assemble release assets
        run: ./gradlew :catalog:assembleDebug :sample:assembleDebug

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

      - name: Package component screenshots
        run: tar -czf component-screenshots.tar.gz -C components/build outputs/roborazzi reports/roborazzi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            catalog/build/outputs/apk/debug/catalog-debug.apk
            sample/build/outputs/apk/debug/sample-debug.apk
            component-screenshots.tar.gz
