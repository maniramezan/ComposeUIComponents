name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan every Monday at 08:00 UTC
    - cron: '0 8 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (kotlin)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          # build-mode: none extracts directly from source files without
          # invoking the Kotlin compiler. This sidesteps CodeQL's Kotlin
          # version ceiling (currently < 2.3.30) and removes the need for
          # a full Android/Gradle build in the security scan job.
          # Switch to build-mode: manual once CodeQL supports Kotlin 2.4.x.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
