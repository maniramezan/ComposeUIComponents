name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan every Monday at 08:00 UTC
    - cron: '0 8 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (kotlin)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          # Always fetch the newest CodeQL bundle so Kotlin support tracks
          # releases without requiring manual workflow updates.
          tools: latest

      - name: Build for analysis
        # CODEQL_EXTRACTOR_JAVA_BYPASS_VERSION_CHECK lets the extractor proceed
        # when the Kotlin version (2.4.0) is newer than the current CodeQL
        # bundle's explicit support list. Analysis quality is unaffected for
        # all language features present before the unsupported version.
        env:
          CODEQL_EXTRACTOR_JAVA_BYPASS_VERSION_CHECK: 'true'
        run: ./gradlew :components:assembleDebug --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
