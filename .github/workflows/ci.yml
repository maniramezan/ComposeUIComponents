name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.2.0
      - name: Check
        run: ./gradlew check
      # Screenshot recording (~11 min of Robolectric/Compose rendering) is the
      # dominant CI cost and is inherently non-cacheable. It only regenerates
      # goldens, so run it on pushes to main, not on every pull request.
      - name: Record component screenshots
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: ./gradlew :components:recordRoborazziDebug
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          name: component-screenshots
          path: |
            components/build/outputs/roborazzi
            components/build/reports/roborazzi
      - name: Assemble catalog
        run: ./gradlew :catalog:assembleDebug
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: catalog-debug-apk
          path: catalog/build/outputs/apk/debug/catalog-debug.apk
      - name: Assemble sample
        run: ./gradlew :sample:assembleDebug
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sample-debug-apk
          path: sample/build/outputs/apk/debug/sample-debug.apk
      - name: Assemble benchmark APK
        run: ./gradlew :baselineprofile:assemble
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: baselineprofile-benchmark-release-apk
          path: baselineprofile/build/outputs/apk/benchmarkRelease/baselineprofile-benchmarkRelease.apk
      - name: Generate Compose compiler reports
        run: ./gradlew composeCompilerReports -PenableComposeCompilerReports=true
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: compose-compiler-reports
          path: |
            **/build/compose-metrics
            **/build/compose-reports
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install docs dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build docs site
        run: mkdocs build --strict
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: docs-site
          path: site

  # Deploys docs to GitHub Pages on every push to main. Runs after `build` so
  # it can download the freshly-recorded component screenshots and bundle them
  # into the MkDocs site — no PNGs need to be committed to the repo.
  deploy-docs:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.pages-deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Download component screenshots
        uses: actions/download-artifact@v8
        with:
          name: component-screenshots
          path: screenshots

      - name: Copy screenshots into docs
        run: |
          mkdir -p docs/images/screenshots
          find screenshots -name "*.png" -exec cp {} docs/images/screenshots/ \;

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install docs dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build docs site with screenshots
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: pages-deployment
        uses: actions/deploy-pages@v5
