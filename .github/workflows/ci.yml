name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.1.0
      - name: Check
        run: ./gradlew check
      - name: Record component screenshots
        run: ./gradlew :components:recordRoborazziDebug
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ always() }}
        with:
          name: component-screenshots
          path: |
            components/build/outputs/roborazzi
            components/build/reports/roborazzi
      - name: Assemble catalog
        run: ./gradlew :catalog:assembleDebug
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: catalog-debug-apk
          path: catalog/build/outputs/apk/debug/catalog-debug.apk
      - name: Assemble sample
        run: ./gradlew :sample:assembleDebug
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sample-debug-apk
          path: sample/build/outputs/apk/debug/sample-debug.apk
      - name: Assemble benchmark APK
        run: ./gradlew :baselineprofile:assembleDebug
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: baselineprofile-debug-apk
          path: baselineprofile/build/outputs/apk/debug/baselineprofile-debug.apk
      - name: Generate Compose compiler reports
        run: ./gradlew composeCompilerReports -PenableComposeCompilerReports=true
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: compose-compiler-reports
          path: |
            **/build/compose-metrics
            **/build/compose-reports
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'
      - name: Install docs dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build docs site
        run: mkdocs build --strict
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: docs-site
          path: site
